services:
    laravel.test:
        build:
            context: '.'
            dockerfile: ./docker/production/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '80:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        env_file:
          - .env
        environment:
            WWWUSER: '${WWWUSER}'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    scheduler:
      image: serversideup/php:8.4-cli
      env_file:
        - .env
      command: [ "php", "/var/www/html/artisan", "schedule:work" ]
      networks:
        - sail
      depends_on:
        - mysql
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
            - './docker/init_wpp_db.sh:/docker-entrypoint-initdb.d/20-create-evolution-db.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    postgres:
      container_name: postgres_naregua
      image: postgres:15
      networks:
        - sail
      command: [ "postgres", "-c", "max_connections=1000" ]
      restart: always
      ports:
        - 5432:5432
      env_file:
        - .env.postgres
      volumes:
        - ./postgres_data:/var/lib/postgresql/data
      expose:
        - 5432
    evolution-api:
      container_name: evolution_api
      image: evoapicloud/evolution-api:v2.3.6
      restart: always
      ports:
        - "8080:8080"
      env_file:
        - .env.evolution
      volumes:
        - ./evolution_instances:/evolution/instances
      networks:
        - sail
      depends_on:
        - postgres
        - redis
    n8n:
      container_name: n8n
      image: n8nio/n8n:latest
      ports:
        - "5678:5678"
      env_file:
        - .env.n8n
      networks:
        - sail
      volumes:
        - ./n8n_data:/data
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
